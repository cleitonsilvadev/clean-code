name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        run: |
          which shellcheck > /dev/null || sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -e SC1091 install.sh

  installer-test:
    name: Test Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Make installer executable
        run: chmod +x install.sh

      - name: Test help flag
        run: ./install.sh --help

      - name: Test global installation
        run: |
          ./install.sh --global
          test -f "$HOME/.agents/skills/clean-code/SKILL.md"
          test -L "$HOME/.claude/skills/clean-code"
          test -f "$HOME/.claude/skills/clean-code/SKILL.md"
          test -f "$HOME/.claude/skills/clean-code/reference.md"

      - name: Test symlink installation
        run: |
          ./install.sh --symlink
          test -L "$HOME/.claude/skills/clean-code"

      - name: Test per-project installation
        run: |
          ./install.sh --project ./test-workspace
          test -f "./test-workspace/.agents/skills/clean-code/SKILL.md"
          test -f "./test-workspace/.claude/skills/clean-code/SKILL.md"
          test -f "./test-workspace/.claude/skills/clean-code/reference.md"

      - name: Test hooks installation (global, idempotent, preserves settings)
        run: |
          mkdir -p "$HOME/.claude"
          echo '{"model":"sonnet"}' > "$HOME/.claude/settings.json"
          ./install.sh --hooks
          ./install.sh --hooks
          test -f "$HOME/.claude/hooks/clean-code-inject.mjs"
          test -f "$HOME/.claude/hooks/clean-code-reset.mjs"
          test -f "$HOME/.claude/hooks/clean-code-session.mjs"
          test "$(grep -c 'clean-code-inject.mjs' "$HOME/.claude/settings.json")" = "1"
          grep -q '"model": "sonnet"' "$HOME/.claude/settings.json"

      - name: Test hooks injection (once per session)
        run: |
          payload='{"session_id":"ci-'"$$"'","tool_input":{"file_path":"a.ts"}}'
          mkdir -p "$HOME/.claude/skills"
          ./install.sh --global
          echo "$payload" | node "$HOME/.claude/hooks/clean-code-inject.mjs" | grep -q "Early return"
          test -z "$(echo "$payload" | node "$HOME/.claude/hooks/clean-code-inject.mjs")"

      - name: Test per-project hooks installation
        run: |
          ./install.sh --hooks ./hooks-workspace
          test -f "./hooks-workspace/.claude/hooks/clean-code-inject.mjs"
          grep -q 'CLAUDE_PROJECT_DIR' "./hooks-workspace/.claude/settings.json"

      - name: Test piped execution (like curl | bash)
        run: |
          cat install.sh | bash -s -- --project ./pipe-workspace
          test -f "./pipe-workspace/.claude/skills/clean-code/SKILL.md"

      - name: Test uninstallation
        run: |
          ./install.sh --uninstall
          ! test -e "$HOME/.claude/skills/clean-code"
          ! test -e "$HOME/.claude/hooks/clean-code-inject.mjs"
          ! grep -q 'clean-code-inject' "$HOME/.claude/settings.json"

      - name: Test Makefile targets
        run: |
          make install
          make uninstall

  docs-check:
    name: Verify Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify referenced files exist
        run: |
          test -f SKILL.md
          test -f reference.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f docs/INSTALL.md
          test -f docs/INSTALL.pt-BR.md
          test -f docs/README.pt-BR.md
          test -f docs/CONTRIBUTING.pt-BR.md
          test -f hooks/clean-code-inject.mjs
          test -f hooks/clean-code-reset.mjs
          test -f hooks/clean-code-session.mjs
          test -f hooks/configure-settings.mjs
          test -f package.json
